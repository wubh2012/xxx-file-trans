<!doctype html>
<!-- 发送端最小封帧播放（issue #3）。
     file:// 直开、零网络请求、零依赖。协议唯一基准：docs/protocol.md。
     播放模式一等化（issue #21）：全屏播放（camera 拍摄配全屏）与窗口播放
     （desktop 抓屏配窗口，复制命令自动带 --region pick）显式切换。
     几何约定（本页为实现基准，接收端几何自举按此推导）：
       - 静默区为黑色，宽度 = PAD × BIT 像素（PAD 单位 = BIT 像素）；
       - 角标 = 白色实心方块，边长严格 = 3×BIT 像素，内角与数据网格四角
         外角重合、伸入静默区（对角线方向），因此要求 PAD ≥ 3；
       - 画布总尺寸 = (COLS + 2×PAD) × BIT 乘 (ROWS + 2×PAD) × BIT，
         按播放模式反推 COLS/ROWS：全屏按屏幕、窗口按视口减四周垫边
         （垫边为页面背景色，量级不进协议）；
       - 全部几何按**物理像素**设计（issue #20）：屏幕尺寸与 BIT 输入均经
         devicePixelRatio（OS 缩放 × 页面缩放）换算为物理值，帧头 BIT 声明
         物理值——接收端抓屏测得物理像素与帧头天然一致，显示缩放 125%/150%
         不再阻塞冻结校验；画布 CSS 显示尺寸 = 位图 ÷ dpr，1 位图 px = 1
         物理 px，不拉伸（宁有黑边）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件摆渡发送端</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #000;              /* 与静默区同色，画布外沿干净 */
    color: #ddd;
    font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #ui { max-width: 640px; padding: 24px; }
  h1 { font-size: 18px; color: #fff; margin: 0 0 12px; }
  fieldset { border: 1px solid #333; border-radius: 6px; margin: 0 0 12px; }
  legend { color: #aaa; padding: 0 6px; }
  label { margin-right: 14px; white-space: nowrap; }
  input[type="number"] { width: 64px; background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; }
  #drop {
    border: 2px dashed #555; border-radius: 8px; padding: 18px;
    text-align: center; color: #aaa; margin-bottom: 12px; cursor: pointer;
  }
  #drop.over { border-color: #8cf; color: #8cf; }
  #info { margin: 0 0 12px; padding: 10px 12px; background: #111; border-radius: 6px; }
  #info td { padding: 1px 10px 1px 0; }
  #info td:first-child { color: #999; }
  #status { color: #8cf; min-height: 1.5em; }
  #stopHint { color: #777; font-size: 12px; }
  #exportBtn, #copyCmdBtn, #playBtn {
    background: #123; color: #eee; border: 1px solid #456; border-radius: 4px;
    padding: 6px 14px; cursor: pointer; font: inherit;
  }
  #exportBtn:disabled, #playBtn:disabled { opacity: .5; cursor: default; }
  .modeBtn {
    background: #111; color: #bbb; border: 1px solid #444; border-radius: 4px;
    padding: 4px 12px; cursor: pointer; font: inherit;
  }
  .modeBtn[aria-pressed="true"] { background: #123; color: #fff; border-color: #8cf; }
  canvas { display: block; image-rendering: pixelated; }  /* 非整数 DPR 下仍按最近邻放大，方块边缘不插值 */
  canvas[hidden] { display: none; }  /* 作者样式会覆盖 [hidden] 的 UA display:none，须显式还原（否则停止播放后画布仍占位挤压 UI） */
  /* 播放中隐藏一切 UI，画布外沿只留与静默区同色的黑背景。
     播放模式一等化（issue #21）：body 同时标注当前模式。全屏画布锚定
     画面左上角（既有行为）；窗口画布居中、body 内边距垫静默边（背景
     同色黑，量级不进协议——裁切容忍后任意边距均可，issue #22），几何
     推导同步减去垫边（WINDOW_PAD_CSS）。停止按钮固定在垫边内、不与
     画布重叠（亮色元素混入抓屏会污染角标检测），故按钮深色、画布距
     视口边缘 ≥ 48px。 */
  body.playing #ui { display: none; }
  body.playing { justify-content: flex-start; align-items: flex-start; }
  body.playing.window { justify-content: center; align-items: center; padding: 48px; }
  #stopBtn {
    display: none; position: fixed; top: 8px; right: 8px; z-index: 10;
    background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px;
    padding: 4px 12px; cursor: pointer; font: inherit;
  }
  body.playing.window #stopBtn { display: block; }
  #ui .hint { margin: 6px 0 0; font-size: 12px; color: #666; max-width: 480px; }
  #windowSizeRow { display: inline-block; vertical-align: middle; margin-left: 8px; }
  #windowSizeRow[hidden] { display: none; }   /* 显式声明，防上面的 display 覆盖 hidden 的 UA 默认 */
  #windowSizeRow input { width: 5.5em; }
  #windowSizeRow .hint { max-width: none; }
</style>
</head>
<body>
<div id="ui">
  <h1>文件摆渡发送端</h1>
  <fieldset>
    <legend>发送参数</legend>
    <label title="每个方块（1 bit）的边长。越大单帧信息越少、传输越慢，但对拍摄/抓屏清晰度要求越低。输入为 CSS 像素，实际按显示缩放（devicePixelRatio）换算为物理像素，帧头声明物理值（上限 15）。默认 6 在 125% 缩放下为物理 BIT=8，兼顾吞吐与稳定性">BIT <input id="bit" type="number" min="1" max="15" value="6"> px/块</label>
    <label title="数据网格四周黑色静默区的宽度，单位为 BIT 像素的倍数。用于隔离画面背景并容纳四角白色角标（角标边长 = 3×BIT，故必须 ≥ 3）。接收端按帧头声明的 PAD 校验，采集画面可任意裁切边距">PAD <input id="pad" type="number" min="3" max="15" value="3"> ×BIT</label>
    <label title="每秒播放的帧数。越高传输越快（总耗时 ≈ 总帧数 ÷ FPS），但受屏幕刷新率与摄像头快门限制，过高会导致拍摄糊帧、丢帧重传（单向信道丢一帧＝等整个循环重播）。camera 拍摄建议保守；desktop 抓屏（DXGI）实测安全上限 30fps（benchmark 实测 45+ 缺帧收不齐），建议 15–20">FPS <input id="fps" type="number" min="1" max="60" value="15"></label>
    <span id="fpsWarn" class="hint" hidden>⚠ FPS > 30：建议先用接收端 calibrate 实测目标机器误帧率（缺帧率 0）再正式传输，否则丢一帧即等整个循环重播</span>
    <p class="hint">BIT＝方块边长（px/块，越大越稳但越慢）；PAD＝网格四周黑色静默边（×BIT，容纳角标）；FPS＝每秒帧数（越高越快，拍摄易糊帧）。悬停各参数可看详细说明。</p>
  </fieldset>
  <fieldset>
    <legend>播放模式</legend>
    <button id="modeFullscreen" type="button" class="modeBtn" aria-pressed="true">全屏播放（camera 拍摄）</button>
    <button id="modeWindow" type="button" class="modeBtn" aria-pressed="false">窗口播放（desktop 抓屏）</button>
    <span id="windowSizeRow" hidden>
      <label title="窗口模式下画面区域的显示尺寸（CSS px，与 BIT 输入同口径，实际按显示缩放换算物理像素）。留空＝随视口自动（减四周垫边）。浏览器页面脚本无法调整窗口大小，请自行把浏览器窗口拉到能容纳画面">窗口画面
        <input id="winW" type="number" min="64" step="1" placeholder="自动"> ×
        <input id="winH" type="number" min="64" step="1" placeholder="自动"> px
      </label>
      <span class="hint">留空＝随视口自动；填宽高＝画面按该尺寸渲染（播放中调整浏览器窗口不影响几何参数）</span>
    </span>
  </fieldset>
  <div id="drop">点击选择或拖入任意文件<br>（gzip 压缩 → 分片封帧 → 按所选模式循环播放）</div>
  <input id="file" type="file" hidden>
  <table id="info" hidden><tbody></tbody></table>
  <p id="status"></p>
  <p><button id="playBtn" type="button" disabled>开始播放</button>
     <button id="exportBtn" type="button">导出 PNG 序列（闭环自测素材）</button>
     <button id="copyCmdBtn" type="button">一键复制接收端命令</button></p>
  <p id="stopHint">全屏播放：按 Esc 或点击画面即停止并返回本页。</p>
</div>
<button id="stopBtn" type="button">停止播放（Esc）</button>
<canvas id="stage" hidden></canvas>
<script>
'use strict';

/* ---------- CRC-32/ISO-HDLC（docs/protocol.md §3，与 zlib.crc32 同参） ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crcUpdate(bytes, crc) {
  for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return crc;
}
function crcFinal(crc) { return (crc ^ 0xFFFFFFFF) >>> 0; }

/* ---------- 前向纠错（协议 §8） ----------
   每 32 个数据帧附带 2 个 GF(256) 校验帧，可恢复同组最多 2 个缺帧。
   校验帧编号紧接 TOTAL_FRAMES 之后，FLAGS bit14 标记校验帧。 */
const FEC_GROUP_SIZE = 32;
const FEC_PARITY_FRAMES = 2;
const FEC_FLAGS = 0xC000; // gzip + FEC
function fecParityCount(total) {
  return total > 0 ? Math.ceil(total / FEC_GROUP_SIZE) * FEC_PARITY_FRAMES : 0;
}
function fecMul(a, b) {
  let out = 0;
  while (b) {
    if (b & 1) out ^= a;
    b >>>= 1;
    a = ((a & 0x80) ? ((a << 1) ^ 0x11D) : (a << 1)) & 0xFF;
  }
  return out & 0xFF;
}
const FEC_MUL = Array.from({ length: FEC_GROUP_SIZE + 1 }, (_, coeff) => {
  const row = new Uint8Array(256);
  for (let value = 0; value < 256; value++) row[value] = fecMul(coeff, value);
  return row;
});

/* 启动自检（协议冻结要求：两端启动时必须自检通过） */
function selfTest() {
  return crcFinal(crcUpdate(new TextEncoder().encode('123456789'), 0xFFFFFFFF)) === 0xCBF43926;
}

/* ---------- 全局发送状态 ---------- */
const state = {
  fileId: 0, fileName: '', plainSize: 0,
  compBuf: null, compSize: 0,
  geo: null,          // { BIT, PAD, COLS, ROWS, FPS, chunkSize }
  totalFrames: 0,
  playing: false,
  mode: 'desktop',       // 当前发送模式：desktop=屏幕播放 / images=导出 PNG（决定复制按钮的接收端命令）
  playMode: 'fullscreen', // 播放模式（issue #21）：fullscreen=全屏（camera 拍摄）/ window=窗口（desktop 抓屏）
};

/* ---------- 几何推导：按屏幕自动反推 COLS/ROWS（物理像素口径，issue #20） ---------- */
const WINDOW_PAD_CSS = 48;  // 窗口播放四周垫边（CSS px，量级不进协议，与 body.playing.window 的 padding 一致）
/* 窗口播放自定义画面尺寸：两框均留空 → null（随视口自动）；任一填写 → 两框都必须是 ≥64 的整数。
   抛错走 deriveGeometry 既有错误通路（startPlayback 捕获并回显状态栏） */
function parseWindowSize() {
  const wRaw = el('winW').value.trim(), hRaw = el('winH').value.trim();
  if (!wRaw && !hRaw) return null;
  const w = parseInt(wRaw, 10), h = parseInt(hRaw, 10);
  if (!w || !h || w < 64 || h < 64) {
    throw new Error('窗口画面尺寸无效：宽高均需 ≥ 64 px，或留空按视口自动');
  }
  return { w, h };
}
function deriveGeometry() {
  // 一律按物理像素推导：devicePixelRatio = OS 缩放 × 页面缩放，一并覆盖
  // 显示缩放（125%/150%）与页面缩放（Ctrl+-）两种场景。接收端（mss 抓屏）
  // 看到的是物理像素，帧头 BIT 声明物理值才能通过冻结校验（协议 §5）
  const dpr = window.devicePixelRatio || 1;
  // 可用 CSS 尺寸：全屏取窗口与屏幕的较小者（全屏成功时两者相等，既有口径）；
  // 窗口优先用用户显式设定的画面区域尺寸（CSS px，窗口播放可自定义大小），
  // 留空则取视口减四周垫边（issue #21），保证画布完整可见且不贴窗口边框
  let availW, availH;
  if (state.playMode === 'window') {
    const custom = parseWindowSize();
    availW = custom ? custom.w : innerWidth - 2 * WINDOW_PAD_CSS;
    availH = custom ? custom.h : innerHeight - 2 * WINDOW_PAD_CSS;
  } else {
    availW = Math.min(screen.width, innerWidth);
    availH = Math.min(screen.height, innerHeight);
  }
  const W = Math.max(1, Math.round(availW * dpr));
  const H = Math.max(1, Math.round(availH * dpr));
  const pad = clampInt(el('pad').value, 3, 15);   // PAD < 3 放不下 3×BIT 角标
  // BIT 输入为 CSS px/块，换算为物理像素并取整（整数 BIT 是 ADR-0001 测量模型前提）
  let bit = Math.max(1, Math.round(clampInt(el('bit').value, 1, 15) * dpr));
  // BIT 过小会使 COLS/ROWS 超出帧头 1 字节上限，自动抬升（UI 回显实际生效值）
  bit = Math.max(bit, Math.ceil(W / (255 + 2 * pad)), Math.ceil(H / (255 + 2 * pad)));
  if (bit > 15) throw new Error('屏幕物理分辨率过高或显示缩放过大，物理 BIT 超出 15 上限（4 bit 帧头），无法编码');
  let cols = Math.floor(W / bit) - 2 * pad;
  let rows = Math.floor(H / bit) - 2 * pad;
  while (rows > 0 && (cols * rows) % 8 !== 0) rows--;   // (COLS×ROWS) mod 8 == 0 冻结约束
  if (cols < 1 || rows < 1) throw new Error('静默区参数过大：数据网格放不下');
  if (cols * rows - 208 < 8) throw new Error('数据区容量不足（BIT 过大或屏幕过小）');
  const chunkSize = (cols * rows - 208) / 8;            // 208 bit 帧头之外的整字节容量
  const fps = clampInt(el('fps').value, 1, 60);
  el('fpsWarn').hidden = fps <= 30;   // 高 FPS 护航：>30 提示先 calibrate 实测误帧率（issue #28）
  return { BIT: bit, PAD: pad, COLS: cols, ROWS: rows, FPS: fps, chunkSize };
}

/* ---------- 封帧（docs/protocol.md §1/§2） ---------- */
function frameDataLen(frameNo) {
  return Math.min(state.geo.chunkSize, state.compSize - frameNo * state.geo.chunkSize);
}
function frameSlice(frameNo) {
  return state.compBuf.subarray(frameNo * state.geo.chunkSize, frameNo * state.geo.chunkSize + frameDataLen(frameNo));
}
function buildHeader(frameNo, data, flags = 0x8000) {
  const h = new Uint8Array(26);
  const dv = new DataView(h.buffer);
  h[0] = 0xF0; h[1] = 0xA5;                       // SYNC（不参与 CRC）
  h[2] = 0x01;                                    // VER
  dv.setUint32(3, state.fileId);                  // FILE_ID
  h[7] = (frameNo >>> 16) & 0xFF;                 // FRAME_NO（3B 大端）
  h[8] = (frameNo >>> 8) & 0xFF;
  h[9] = frameNo & 0xFF;
  h[10] = (state.totalFrames >>> 16) & 0xFF;      // TOTAL_FRAMES（3B 大端）
  h[11] = (state.totalFrames >>> 8) & 0xFF;
  h[12] = state.totalFrames & 0xFF;
  dv.setUint16(13, data.length);                  // DATA_LEN
  dv.setUint16(15, state.geo.chunkSize);          // CHUNK_SIZE
  h[17] = state.geo.COLS;
  h[18] = state.geo.ROWS;
  h[19] = (state.geo.BIT << 4) | state.geo.PAD;   // GEO：高 4 bit BIT，低 4 bit PAD
  dv.setUint16(20, flags);                        // FLAGS：gzip / FEC
  // CRC 覆盖偏移 2–21 + 数据区有效字节（冻结关键）
  dv.setUint32(22, crcFinal(crcUpdate(data, crcUpdate(h.subarray(2, 22), 0xFFFFFFFF))));
  return h;
}

function fecParityPayload(group, parityIndex) {
  const chunk = state.geo.chunkSize;
  const start = group * FEC_GROUP_SIZE;
  const out = new Uint8Array(chunk);
  for (let relative = 0; relative < FEC_GROUP_SIZE; relative++) {
    const frameNo = start + relative;
    if (frameNo >= state.totalFrames) break;
    const data = frameSlice(frameNo);
    const coeff = relative + 1;
    for (let i = 0; i < data.length; i++) {
      out[i] ^= parityIndex === 0 ? data[i] : FEC_MUL[coeff][data[i]];
    }
  }
  return out;
}

function fecFramePayload(frameNo) {
  const relative = frameNo - state.totalFrames;
  const group = Math.floor(relative / FEC_PARITY_FRAMES);
  const parityIndex = relative % FEC_PARITY_FRAMES;
  return fecParityPayload(group, parityIndex);
}

function fecFrameCount() {
  return fecParityCount(state.totalFrames);
}

/* 帧 → COLS×ROWS 位网格：行优先、字节内 MSB first，黑块 = 1 */
function encodeFrameGrid(header, data) {
  const gridBytes = new Uint8Array(state.geo.COLS * state.geo.ROWS / 8);
  let bitPos = 0;
  const writeBits = (bytes) => {
    for (let i = 0; i < bytes.length; i++) {
      const b = bytes[i];
      if (b === 0) { bitPos += 8; continue; }
      for (let k = 7; k >= 0; k--) {
        if ((b >> k) & 1) gridBytes[bitPos >> 3] |= 0x80 >> (bitPos & 7);
        bitPos++;
      }
    }
  };
  writeBits(header);
  writeBits(data);
  return gridBytes;
}

/* ---------- 元数据帧（docs/protocol.md §4）：帧号 0xFFFFFF，12+nameLen 布局 ---------- */
function buildMetadataPayload() {
  const name = new TextEncoder().encode(state.fileName);
  const p = new Uint8Array(12 + name.length);
  const dv = new DataView(p.buffer);
  p[0] = 0x01;                                    // 压缩方式：gzip
  dv.setUint32(1, state.plainSize);               // plainSize（原始文件大小）
  dv.setUint32(5, state.compSize);                // compressedSize（压缩后大小）
  dv.setUint16(9, name.length);                   // nameLen（文件名字节长）
  p[11] = 0x00;                                   // 保留
  p.set(name, 12);
  return p;
}
function buildMetadataFrame() {
  const payload = buildMetadataPayload();
  const h = new Uint8Array(26);
  const dv = new DataView(h.buffer);
  h[0] = 0xF0; h[1] = 0xA5;                       // SYNC（不参与 CRC）
  h[2] = 0x01;                                    // VER
  dv.setUint32(3, state.fileId);                  // FILE_ID
  h[7] = 0xFF; h[8] = 0xFF; h[9] = 0xFF;          // FRAME_NO = 0xFFFFFF（元数据哨兵）
  h[10] = (state.totalFrames >>> 16) & 0xFF;      // TOTAL_FRAMES：数据帧数（不含元数据帧）
  h[11] = (state.totalFrames >>> 8) & 0xFF;
  h[12] = state.totalFrames & 0xFF;
  dv.setUint16(13, payload.length);               // DATA_LEN = 12 + nameLen
  dv.setUint16(15, state.geo.chunkSize);          // CHUNK_SIZE
  h[17] = state.geo.COLS;
  h[18] = state.geo.ROWS;
  h[19] = (state.geo.BIT << 4) | state.geo.PAD;   // GEO：高 4 bit BIT，低 4 bit PAD
  h[20] = 0x80; h[21] = 0x00;                     // FLAGS：bit15 = gzip
  // CRC 覆盖偏移 2–21 + 数据区有效字节（冻结关键）
  dv.setUint32(22, crcFinal(crcUpdate(payload, crcUpdate(h.subarray(2, 22), 0xFFFFFFFF))));
  return { header: h, payload };
}

/* ---------- 渲染：离屏 1px/块 → 整数倍 BIT 放大 + 黑静默区 + 白角标 ---------- */
const stage = el('stage');
const ctx = stage.getContext('2d');
const gridCanvas = document.createElement('canvas');
const gridCtx = gridCanvas.getContext('2d');
let frameImage = null;

function setupCanvas() {
  const { BIT, PAD, COLS, ROWS } = state.geo;
  stage.width = (COLS + 2 * PAD) * BIT;
  stage.height = (ROWS + 2 * PAD) * BIT;
  // CSS 显示尺寸 = 位图 ÷ dpr：1 位图 px = 1 物理 px，全屏播放不拉伸
  //（像素级 1:1 优先，画布不满屏时余下为与静默区同色的黑边）
  const dpr = window.devicePixelRatio || 1;
  stage.style.width = (stage.width / dpr) + 'px';
  stage.style.height = (stage.height / dpr) + 'px';
  gridCanvas.width = COLS; gridCanvas.height = ROWS;
  frameImage = gridCtx.createImageData(COLS, ROWS);
}

function renderGrid(gridBytes) {
  const { BIT, PAD, COLS, ROWS } = state.geo;
  const px = frameImage.data;                       // 先全白（0），再点黑（1）
  for (let i = 0; i < px.length; i++) px[i] = 255;
  for (let byte = 0; byte < gridBytes.length; byte++) {
    const b = gridBytes[byte];
    if (b === 0) continue;
    for (let k = 7; k >= 0; k--) {
      if ((b >> k) & 1) {
        const cell = byte * 8 + (7 - k);
        const o = ((cell / COLS | 0) * COLS + (cell % COLS)) * 4;
        px[o] = px[o + 1] = px[o + 2] = 0; px[o + 3] = 255;
      }
    }
  }
  gridCtx.putImageData(frameImage, 0, 0);
  ctx.imageSmoothingEnabled = false;                // 整数倍缩放，无插值
  ctx.fillStyle = '#000';                           // 静默区
  ctx.fillRect(0, 0, stage.width, stage.height);
  ctx.drawImage(gridCanvas, PAD * BIT, PAD * BIT, COLS * BIT, ROWS * BIT);
  const m = 3 * BIT, ox = PAD * BIT, oy = PAD * BIT, gw = COLS * BIT, gh = ROWS * BIT;
  ctx.fillStyle = '#fff';                           // 角标：白色实心方块，边长 3×BIT，内角贴网格外角
  ctx.fillRect(ox - m, oy - m, m, m);
  ctx.fillRect(ox + gw, oy - m, m, m);
  ctx.fillRect(ox - m, oy + gh, m, m);
  ctx.fillRect(ox + gw, oy + gh, m, m);
}

function renderFrame(frameNo) {
  const data = frameSlice(frameNo);
  renderGrid(encodeFrameGrid(buildHeader(frameNo, data), data));
}
function renderFecFrame(frameNo) {
  const data = fecFramePayload(frameNo);
  renderGrid(encodeFrameGrid(buildHeader(frameNo, data, FEC_FLAGS), data));
}
function renderMetadataFrame() {
  const m = buildMetadataFrame();
  renderGrid(encodeFrameGrid(m.header, m.payload));
}

/* ---------- 播放循环：无限循环重播；元数据帧与 FEC 校验帧均占一拍 ---------- */
const FINAL_FRAME_HOLD_MS = 1000; // 每轮末帧留出一秒，给抓屏端稳定采样
let rafId = 0, lastTs = 0, playPos = 0, holdUntil = 0, playbackSequence = [];
function buildPlaybackSequence() {
  const seq = [];
  let group = 0;
  for (let frameNo = 0; frameNo < state.totalFrames; frameNo++) {
    if (frameNo % 100 === 0) seq.push(-1); // 元数据帧（每 100 个数据帧）
    seq.push(frameNo);
    if (frameNo % FEC_GROUP_SIZE === FEC_GROUP_SIZE - 1
        || frameNo === state.totalFrames - 1) {
      for (let parity = 0; parity < FEC_PARITY_FRAMES; parity++) {
        seq.push(-(2 + state.totalFrames + group * FEC_PARITY_FRAMES + parity));
      }
      group++;
    }
  }
  return seq;
}
function loop(ts) {
  if (!state.playing) return;
  if (ts < holdUntil) {
    rafId = requestAnimationFrame(loop);
    return;
  }
  if (ts - lastTs >= 1000 / state.geo.FPS) {
    lastTs = ts;
    const item = playbackSequence[playPos];
    if (item === -1) {
      renderMetadataFrame();
    } else if (item >= 0) {
      renderFrame(item);
      if (item === state.totalFrames - 1) holdUntil = ts + FINAL_FRAME_HOLD_MS;
    } else {
      renderFecFrame(-item - 2);
    }
    playPos = (playPos + 1) % playbackSequence.length;
  }
  rafId = requestAnimationFrame(loop);
}

async function startPlayback() {
  state.mode = 'desktop';
  // 播放模式一等化（issue #21）：显式所选模式播放，不再「全屏优先、失败降级」。
  // 窗口播放不请求全屏；全屏播放先争取全屏再反推几何（被拒时按当前窗口，
  // 画布完整可见、四角角标不被裁掉——几何自举依赖角标）
  if (state.playMode !== 'window') {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
  }
  try {
    state.geo = deriveGeometry();
  } catch (e) {
    setStatus('几何参数错误：' + e.message, true);
    return;
  }
  state.totalFrames = Math.ceil(state.compSize / state.geo.chunkSize);
  if (state.totalFrames + fecFrameCount() > 0xFFFFFF) {
    setStatus('文件过大：数据帧 + FEC 帧号超出 3 字节上限', true); return;
  }
  // 元数据帧 12+nameLen 超出 CHUNK_SIZE 时接收端必整帧丢弃（§4），发送端在此拦截，
  // 避免每轮元数据永远缺失、文件无法还原且无提示
  const nameBytes = new TextEncoder().encode(state.fileName).length;
  if (12 + nameBytes > state.geo.chunkSize) {
    setStatus(`文件名过长：12+nameLen=${12 + nameBytes} 超出单帧 CHUNK_SIZE ${state.geo.chunkSize}，无法发送`, true);
    return;
  }
  updateInfo();
  setupCanvas();
  stage.hidden = false;
  document.body.classList.add('playing', state.playMode);   // 模式标注供样式与自动化
  state.playing = true;
  requestWakeLock();   // 防熄屏（issue #32）：挂播放生命周期，不支持时静默降级
  playbackSequence = buildPlaybackSequence();
  playPos = 0; holdUntil = 0; lastTs = -1e9;
  rafId = requestAnimationFrame(loop);
}

function stopPlayback() {
  state.playing = false;
  releaseWakeLock();
  hiddenWhilePlaying = false;
  cancelAnimationFrame(rafId);
  stage.hidden = true;
  document.body.classList.remove('playing', 'fullscreen', 'window');
  el('playBtn').disabled = false;   // 文件已加载，可直接换模式重播
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

/* ---------- 播放可靠性护栏（issue #32）---------- */
/* Wake Lock 防熄屏：显示器空闲熄屏实测会让 rAF 停摆、接收端 ACCESS_LOST，
   整轮报废（benchmark 复测）。播放期间申请 screen Wake Lock；系统强制释放
   （含页面切后台）后由 visibilitychange 切回路径自动重取；停止播放主动释放。
   浏览器不支持该 API 时静默降级——不报错、不阻塞播放。 */
let wakeLock = null;
async function requestWakeLock() {
  if (!state.playing || wakeLock || !('wakeLock' in navigator)) return;
  try {
    const wl = await navigator.wakeLock.request('screen');
    if (!state.playing) {   // await 期间已停止播放：立即释放，不留悬挂的锁
      wl.release().catch(() => {});
      return;
    }
    wakeLock = wl;
    wl.addEventListener('release', () => { if (wakeLock === wl) wakeLock = null; });
  } catch (e) { /* 系统拒绝等场景：播放不受阻（hidden 态切回后由下方自动重取） */ }
}
function releaseWakeLock() {
  if (!wakeLock) return;
  const wl = wakeLock;
  wakeLock = null;   // 先清内部状态，release 触发的事件回调即成空操作
  wl.release().catch(() => {});
}

/* 后台标签页节流警示：rAF 在页面 hidden 后降到 ~1fps，传输静默停滞，
   单向信道下用户无从察觉。播放期间切离再切回时给一次性状态栏提示；
   同时承担 Wake Lock 自动重取（页面 hidden 时被系统释放）。 */
let hiddenWhilePlaying = false;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    hiddenWhilePlaying = state.playing;
  } else {
    if (hiddenWhilePlaying) {
      hiddenWhilePlaying = false;
      if (state.playing) setStatus('播放曾被后台暂停/节流，建议确认接收端收帧情况', true);
    }
    // 无条件补取：覆盖 hidden 态启动播放（request 被拒）的边界，
    // 正常播放中锁未失守时此调用为空操作
    requestWakeLock();
  }
});

/* ---------- 文件处理：fileId（纯内容 CRC32）→ gzip → 分片封帧 ---------- */
/* 逐块读流，返回总字节数；onChunk 可选回调处理每块 */
async function readStream(stream, onChunk) {
  const reader = stream.getReader();
  let size = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    size += value.length;
    if (onChunk) onChunk(value);
  }
  return size;
}

async function handleFile(file) {
  stopPlayback();
  setStatus('计算 fileId（纯内容 CRC32）…');
  let crc = 0xFFFFFFFF;
  const plain = await readStream(file.stream(), (v) => { crc = crcUpdate(v, crc); });
  state.fileId = crcFinal(crc);
  state.fileName = file.name; state.plainSize = plain;

  if (typeof CompressionStream === 'undefined') {
    setStatus('本浏览器不支持 CompressionStream，无法 gzip 压缩', true);
    return;
  }
  setStatus('gzip 压缩中…');
  const chunks = [];
  const size = await readStream(file.stream().pipeThrough(new CompressionStream('gzip')), (v) => chunks.push(v));
  state.compBuf = new Uint8Array(size);
  let off = 0;
  for (const c of chunks) { state.compBuf.set(c, off); off += c.length; }
  state.compSize = size;

  setStatus(`已就绪：${PLAY_MODES[state.playMode].label}，循环播放中`);
  el('playBtn').disabled = false;
  startPlayback();
}

/* ---------- 导出 PNG 序列（F9 最小实现，issue #5）：frames_png/<seq6>.png + frames.json ----------
   闭环自测（CONTEXT.md）：导出目录直喂接收端 images 源，验证双端协议一致性。
   帧序列与播放节奏完全一致：每 100 个数据帧前插元数据帧，每组数据帧后插 FEC 校验帧。 */
/* 播放模式注册表（issue #21）：显示名 / 配对取帧源 / 停止提示 / desktop
   源命令的单一事实源。模式行为差异（几何可用尺寸、是否请求全屏、点击
   是否停止）保留在各职责点的分支，不进此表。 */
const PLAY_MODES = {
  fullscreen: {
    label: '全屏播放', source: 'camera 拍摄',
    stopHint: '全屏播放：按 Esc 或点击画面即停止并返回本页。',
    desktopCmd: 'python -m receiver receive --source desktop --out output',
  },
  window: {
    label: '窗口播放', source: 'desktop 抓屏',
    stopHint: '窗口播放：按 Esc 或「停止播放」按钮停止；点击画面不会停止。',
    desktopCmd: 'python -m receiver receive --source desktop --region pick --out output',
  },
};

/* 接收端命令生成（Story 6，issue #18/#21/#22）：复制按钮与 frames.json 同源。
   命令随发送模式（desktop/images）与播放模式（全屏/窗口）联动：窗口播放
   自动带 `--region pick`（接收端冻屏框选）；全屏播放与导出 PNG 命令不变，
   既有流程零影响。几何参数由接收端角标自举推导，不进命令行。 */
const IMAGES_RECEIVER_COMMAND =
  'python -m receiver receive --source images --dir frames_png --out output';
function buildReceiverCommand(sendMode = state.mode) {
  if (sendMode === 'images') return IMAGES_RECEIVER_COMMAND;
  return PLAY_MODES[state.playMode].desktopCmd;
}
function ensureFrameState() {
  if (!state.compBuf) throw new Error('尚未选择文件');
  if (!state.geo) {
    state.geo = deriveGeometry();
    state.totalFrames = Math.ceil(state.compSize / state.geo.chunkSize);
    updateInfo();
  }
}
function exportSequence() {
  return buildPlaybackSequence();
}
function pngBytes() {
  return new Promise((resolve) => stage.toBlob(resolve, 'image/png'))
    .then((blob) => blob.arrayBuffer())
    .then((buf) => new Uint8Array(buf));
}
function buildFramesJson(totalExported) {
  const g = state.geo;
  return JSON.stringify({
    fileId: '0x' + state.fileId.toString(16).toUpperCase().padStart(8, '0'),
    fileName: state.fileName,
    plainSize: state.plainSize,
    compressedSize: state.compSize,
    geometry: { COLS: g.COLS, ROWS: g.ROWS, BIT: g.BIT, PAD: g.PAD },
    chunkSize: g.chunkSize,
    totalFrames: state.totalFrames,
    fec: { groupSize: FEC_GROUP_SIZE, parityFrames: FEC_PARITY_FRAMES,
           totalParityFrames: fecFrameCount() },
    totalExported,
    receiverCommand: buildReceiverCommand('images'),
  }, null, 2);
}
async function buildExportFrames() {
  ensureFrameState();
  setupCanvas();   // 画布尺寸就绪（hidden 状态下绘制与导出同样有效）
  const files = [];
  let seq = 0;
  for (const f of exportSequence()) {
    if (f === -1) renderMetadataFrame();
    else if (f >= 0) renderFrame(f);
    else renderFecFrame(-f - 2);
    seq++;
    files.push({ name: `frames_png/${String(seq).padStart(6, '0')}.png`, bytes: await pngBytes() });
  }
  files.push({ name: 'frames.json', text: buildFramesJson(seq) });
  return files;
}
async function exportViaPicker(files) {
  // 首选目录选择器：用户授权后真实写出 frames_png/ + frames.json
  const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
  const pngDir = await dir.getDirectoryHandle('frames_png', { create: true });
  for (const f of files) {
    const target = f.name === 'frames.json'
      ? await dir.getFileHandle('frames.json', { create: true })
      : await pngDir.getFileHandle(f.name.split('/')[1], { create: true });
    const w = await target.createWritable();
    await w.write(f.bytes ?? f.text);
    await w.close();
  }
}
async function exportViaDownloads(files) {
  // 回退：无目录选择权限 / 不支持时逐文件下载（自动化捕获即取外沿行为）
  for (const f of files) {
    const blob = f.bytes ? new Blob([f.bytes], { type: 'image/png' })
                         : new Blob([f.text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = f.name.includes('/') ? f.name.split('/')[1] : f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    await new Promise((r) => setTimeout(r, 80));   // 逐个错开，便于自动化逐个捕获
  }
}
el('exportBtn').addEventListener('click', async () => {
  const btn = el('exportBtn');
  btn.disabled = true;
  try {
    const files = await buildExportFrames();
    setStatus('导出中…');
    // 自动化环境（navigator.webdriver）：无原生对话框，直接走下载回退，
    // 否则 showDirectoryPicker 在 headless 下会无限挂起
    if (typeof window.showDirectoryPicker === 'function' && !navigator.webdriver) {
      try {
        await exportViaPicker(files);
      } catch (e) {
        if (e && e.name === 'AbortError') { setStatus('已取消导出'); return; }
        await exportViaDownloads(files);   // 授权失败等场景回退为逐文件下载
      }
    } else {
      await exportViaDownloads(files);
    }
    // 复制按钮命令随发送模式切换（issue #18）：导出成功才置 images，
    // 取消 / 失败时 frames_png 未产出，命令不得指向不存在的帧目录
    state.mode = 'images';
    setStatus(`已导出 ${files.length} 个文件（frames_png/*.png + frames.json）`);
  } catch (e) {
    setStatus('导出失败：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

/* 一键复制接收端命令（Story 6，issue #18）：命令与当前发送模式一致。
   窗口播放附带「先播放后接收」顺序提示（Spec Further Notes：由复制命令
   的状态文案承载，只进状态不进剪贴板——粘贴即可直接执行）。
   剪贴板失败（非安全上下文 / 权限拒绝）给出可见错误并附带命令文本，便于手动复制 */
el('copyCmdBtn').addEventListener('click', async () => {
  const cmd = buildReceiverCommand();
  const label = state.mode === 'images' ? '导出 PNG' : PLAY_MODES[state.playMode].label;
  const hint = state.mode === 'desktop' && state.playMode === 'window'
    ? '（先播放后接收：先开始窗口播放，再运行接收端框选）' : '';
  try {
    await navigator.clipboard.writeText(cmd);
    setStatus(`已复制接收端命令（${label}）：${cmd}${hint}`);
  } catch (e) {
    setStatus(`复制失败（${e && e.message ? e.message : e}）：请手动复制——${cmd}`, true);
  }
});

/* ---------- UI ---------- */
function el(id) { return document.getElementById(id); }
function clampInt(v, lo, hi) {
  const n = parseInt(v, 10);
  return isNaN(n) ? lo : Math.min(hi, Math.max(lo, n));
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function setStatus(msg, isErr) {
  const s = el('status');
  s.textContent = msg;
  s.style.color = isErr ? '#f66' : '#8cf';
  s.style.fontWeight = isErr ? 'bold' : 'normal';
}
function updateInfo() {
  const g = state.geo;
  const rows = [
    ['fileId（内容 CRC32）', '0x' + state.fileId.toString(16).toUpperCase().padStart(8, '0')],
    ['文件名', escapeHtml(state.fileName)],
    ['原始 / 压缩大小', `${state.plainSize} / ${state.compSize} 字节`],
    ['BIT / PAD / FPS', `${g.BIT} px（物理）/ ${g.PAD}×BIT / ${g.FPS}`],
    ['COLS × ROWS', `${g.COLS} × ${g.ROWS}`],
    ['chunkSize', `${g.chunkSize} 字节/帧`],
    ['总帧数', `${state.totalFrames}（每轮约 ${(state.totalFrames / g.FPS).toFixed(1)} 秒）`],
    ['FEC 校验帧', `${fecFrameCount()}（每 32 个数据帧附加 2 个）`],
  ];
  const tb = el('info').tBodies[0];
  tb.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  el('info').hidden = false;
}

const drop = el('drop'), fileInput = el('file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
el('fps').addEventListener('input', () => {
  // 高 FPS 护航实时提示（issue #28）：与 deriveGeometry 同口径钳位后判断
  el('fpsWarn').hidden = clampInt(el('fps').value, 1, 60) <= 30;
});
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

/* ---------- 播放模式一等化（issue #21）：全屏 / 窗口显式切换 ---------- */
function setPlayMode(mode) {
  state.playMode = mode;
  const m = PLAY_MODES[mode];
  el('modeFullscreen').setAttribute('aria-pressed', String(mode === 'fullscreen'));
  el('modeWindow').setAttribute('aria-pressed', String(mode === 'window'));
  el('stopHint').textContent = m.stopHint;
  el('windowSizeRow').hidden = mode !== 'window';   // 窗口画面尺寸仅窗口模式可设
  setStatus(`播放模式：${m.label}（${m.source}）`);
}
el('modeFullscreen').addEventListener('click', () => setPlayMode('fullscreen'));
el('modeWindow').addEventListener('click', () => setPlayMode('window'));
el('playBtn').addEventListener('click', () => { if (state.compBuf) startPlayback(); });

stage.addEventListener('click', () => {
  // 窗口播放禁用点击停止（story 4）：抓屏 / 框选时防误触；全屏保留既有交互
  if (state.playMode !== 'window') stopPlayback();
});
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') stopPlayback(); });
el('stopBtn').addEventListener('click', stopPlayback);

if (!selfTest()) {
  setStatus('CRC 自检未通过（期望 CRC32("123456789") == 0xCBF43926），已禁用发送', true);
  fileInput.disabled = true;
} else {
  setStatus('自检通过（CRC-32/ISO-HDLC），选择文件开始发送');
}

/* 仅供自动化验证 / 闭环自测使用（file:// 本地，无网络暴露面） */
window.__sender = {
  state, selfTest, crcUpdate, crcFinal, deriveGeometry,
  encodeFrameGrid, buildMetadataPayload, buildMetadataFrame,
  renderFrame, renderMetadataFrame, buildExportFrames, buildReceiverCommand,
  hasWakeLock: () => !!wakeLock,   // Wake Lock 生命周期断言（issue #32）
  FINAL_FRAME_HOLD_MS,
};
</script>
</body>
</html>
