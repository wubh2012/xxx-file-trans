<!doctype html>
<!-- 发送端最小封帧播放（issue #3）。
     file:// 直开、零网络请求、零依赖。协议唯一基准：docs/protocol.md。
     几何约定（本页为实现基准，接收端几何自举按此推导）：
       - 静默区为黑色，宽度 = PAD × BIT 像素（PAD 单位 = BIT 像素）；
       - 角标 = 白色实心方块，边长严格 = 3×BIT 像素，内角与数据网格四角
         外角重合、伸入静默区（对角线方向），因此要求 PAD ≥ 3；
       - 画布总尺寸 = (COLS + 2×PAD) × BIT 乘 (ROWS + 2×PAD) × BIT，
         按屏幕自动反推 COLS/ROWS，整数倍缩放（1 方块 = BIT 像素，无插值）；
       - 全部几何按**物理像素**设计（issue #20）：屏幕尺寸与 BIT 输入均经
         devicePixelRatio（OS 缩放 × 页面缩放）换算为物理值，帧头 BIT 声明
         物理值——接收端抓屏测得物理像素与帧头天然一致，显示缩放 125%/150%
         不再阻塞冻结校验；画布 CSS 显示尺寸 = 位图 ÷ dpr，1 位图 px = 1
         物理 px，全屏播放不拉伸（宁有黑边）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件摆渡发送端</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #000;              /* 与静默区同色，画布外沿干净 */
    color: #ddd;
    font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #ui { max-width: 640px; padding: 24px; }
  h1 { font-size: 18px; color: #fff; margin: 0 0 12px; }
  fieldset { border: 1px solid #333; border-radius: 6px; margin: 0 0 12px; }
  legend { color: #aaa; padding: 0 6px; }
  label { margin-right: 14px; white-space: nowrap; }
  input[type="number"] { width: 64px; background: #111; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; }
  #drop {
    border: 2px dashed #555; border-radius: 8px; padding: 18px;
    text-align: center; color: #aaa; margin-bottom: 12px; cursor: pointer;
  }
  #drop.over { border-color: #8cf; color: #8cf; }
  #info { margin: 0 0 12px; padding: 10px 12px; background: #111; border-radius: 6px; }
  #info td { padding: 1px 10px 1px 0; }
  #info td:first-child { color: #999; }
  #status { color: #8cf; min-height: 1.5em; }
  #stopHint { color: #777; font-size: 12px; }
  #exportBtn, #copyCmdBtn {
    background: #123; color: #eee; border: 1px solid #456; border-radius: 4px;
    padding: 6px 14px; cursor: pointer; font: inherit;
  }
  #exportBtn:disabled { opacity: .5; cursor: default; }
  canvas { display: block; image-rendering: pixelated; }  /* 非整数 DPR 下仍按最近邻放大，方块边缘不插值 */
  canvas[hidden] { display: none; }  /* 作者样式会覆盖 [hidden] 的 UA display:none，须显式还原（否则停止播放后画布仍占位挤压 UI） */
  /* 播放中隐藏一切 UI，画布外沿只留与静默区同色的黑背景。
     画布必须锚定画面左上角（不居中）：接收端几何自举按「画面即画布」
     推 PAD（pad = 网格原点 ÷ BIT，见 receiver/pipeline.py），画布小于
     屏幕时（非整除余量 / 黑边）居中会让网格原点带任意偏移，原点不再
     是 PAD×BIT 的整数倍 → 整帧被拒。左上角锚定保证原点恒为 PAD×BIT。 */
  body.playing #ui { display: none; }
  body.playing { justify-content: flex-start; align-items: flex-start; }
</style>
</head>
<body>
<div id="ui">
  <h1>文件摆渡发送端</h1>
  <fieldset>
    <legend>发送参数</legend>
    <label title="CSS 像素；实际按显示缩放（devicePixelRatio）换算为物理像素，帧头声明物理值">BIT <input id="bit" type="number" min="1" max="15" value="8"> px/块</label>
    <label>PAD <input id="pad" type="number" min="3" max="15" value="4"> ×BIT</label>
    <label>FPS <input id="fps" type="number" min="1" max="30" value="5"></label>
  </fieldset>
  <div id="drop">点击选择或拖入任意文件<br>（gzip 压缩 → 分片封帧 → 全屏循环播放）</div>
  <input id="file" type="file" hidden>
  <table id="info" hidden><tbody></tbody></table>
  <p id="status"></p>
  <p><button id="exportBtn" type="button">导出 PNG 序列（闭环自测素材）</button>
     <button id="copyCmdBtn" type="button">一键复制接收端命令</button></p>
  <p id="stopHint">播放中按 Esc 或点击画面即停止并返回本页。</p>
</div>
<canvas id="stage" hidden></canvas>
<script>
'use strict';

/* ---------- CRC-32/ISO-HDLC（docs/protocol.md §3，与 zlib.crc32 同参） ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crcUpdate(bytes, crc) {
  for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return crc;
}
function crcFinal(crc) { return (crc ^ 0xFFFFFFFF) >>> 0; }

/* 启动自检（协议冻结要求：两端启动时必须自检通过） */
function selfTest() {
  return crcFinal(crcUpdate(new TextEncoder().encode('123456789'), 0xFFFFFFFF)) === 0xCBF43926;
}

/* ---------- 全局发送状态 ---------- */
const state = {
  fileId: 0, fileName: '', plainSize: 0,
  compBuf: null, compSize: 0,
  geo: null,          // { BIT, PAD, COLS, ROWS, FPS, chunkSize }
  totalFrames: 0,
  playing: false,
  mode: 'desktop',  // 当前发送模式：desktop=全屏播放 / images=导出 PNG（决定复制按钮的接收端命令）
};

/* ---------- 几何推导：按屏幕自动反推 COLS/ROWS（物理像素口径，issue #20） ---------- */
function deriveGeometry() {
  // 一律按物理像素推导：devicePixelRatio = OS 缩放 × 页面缩放，一并覆盖
  // 显示缩放（125%/150%）与页面缩放（Ctrl+-）两种场景。接收端（mss 抓屏）
  // 看到的是物理像素，帧头 BIT 声明物理值才能通过冻结校验（协议 §5）
  const dpr = window.devicePixelRatio || 1;
  // 取窗口与屏幕的较小者：全屏成功时两者相等；全屏被拒时按当前窗口反推，
  // 保证画布完整可见、四角角标不被裁掉（接收端几何自举依赖角标）
  const W = Math.round(Math.min(screen.width, innerWidth) * dpr);
  const H = Math.round(Math.min(screen.height, innerHeight) * dpr);
  const pad = clampInt(el('pad').value, 3, 15);   // PAD < 3 放不下 3×BIT 角标
  // BIT 输入为 CSS px/块，换算为物理像素并取整（整数 BIT 是 ADR-0001 测量模型前提）
  let bit = Math.max(1, Math.round(clampInt(el('bit').value, 1, 15) * dpr));
  // BIT 过小会使 COLS/ROWS 超出帧头 1 字节上限，自动抬升（UI 回显实际生效值）
  bit = Math.max(bit, Math.ceil(W / (255 + 2 * pad)), Math.ceil(H / (255 + 2 * pad)));
  if (bit > 15) throw new Error('屏幕物理分辨率过高或显示缩放过大，物理 BIT 超出 15 上限（4 bit 帧头），无法编码');
  let cols = Math.floor(W / bit) - 2 * pad;
  let rows = Math.floor(H / bit) - 2 * pad;
  while (rows > 0 && (cols * rows) % 8 !== 0) rows--;   // (COLS×ROWS) mod 8 == 0 冻结约束
  if (cols < 1 || rows < 1) throw new Error('静默区参数过大：数据网格放不下');
  if (cols * rows - 208 < 8) throw new Error('数据区容量不足（BIT 过大或屏幕过小）');
  const chunkSize = (cols * rows - 208) / 8;            // 208 bit 帧头之外的整字节容量
  const fps = clampInt(el('fps').value, 1, 30);
  return { BIT: bit, PAD: pad, COLS: cols, ROWS: rows, FPS: fps, chunkSize };
}

/* ---------- 封帧（docs/protocol.md §1/§2） ---------- */
function frameDataLen(frameNo) {
  return Math.min(state.geo.chunkSize, state.compSize - frameNo * state.geo.chunkSize);
}
function frameSlice(frameNo) {
  return state.compBuf.subarray(frameNo * state.geo.chunkSize, frameNo * state.geo.chunkSize + frameDataLen(frameNo));
}
function buildHeader(frameNo) {
  const h = new Uint8Array(26);
  const dv = new DataView(h.buffer);
  h[0] = 0xF0; h[1] = 0xA5;                       // SYNC（不参与 CRC）
  h[2] = 0x01;                                    // VER
  dv.setUint32(3, state.fileId);                  // FILE_ID
  h[7] = (frameNo >>> 16) & 0xFF;                 // FRAME_NO（3B 大端）
  h[8] = (frameNo >>> 8) & 0xFF;
  h[9] = frameNo & 0xFF;
  h[10] = (state.totalFrames >>> 16) & 0xFF;      // TOTAL_FRAMES（3B 大端）
  h[11] = (state.totalFrames >>> 8) & 0xFF;
  h[12] = state.totalFrames & 0xFF;
  dv.setUint16(13, frameDataLen(frameNo));        // DATA_LEN
  dv.setUint16(15, state.geo.chunkSize);          // CHUNK_SIZE
  h[17] = state.geo.COLS;
  h[18] = state.geo.ROWS;
  h[19] = (state.geo.BIT << 4) | state.geo.PAD;   // GEO：高 4 bit BIT，低 4 bit PAD
  h[20] = 0x80; h[21] = 0x00;                     // FLAGS：bit15 = gzip
  // CRC 覆盖偏移 2–21 + 数据区有效字节（冻结关键）
  dv.setUint32(22, crcFinal(crcUpdate(frameSlice(frameNo), crcUpdate(h.subarray(2, 22), 0xFFFFFFFF))));
  return h;
}

/* 帧 → COLS×ROWS 位网格：行优先、字节内 MSB first，黑块 = 1 */
function encodeFrameGrid(header, data) {
  const gridBytes = new Uint8Array(state.geo.COLS * state.geo.ROWS / 8);
  let bitPos = 0;
  const writeBits = (bytes) => {
    for (let i = 0; i < bytes.length; i++) {
      const b = bytes[i];
      if (b === 0) { bitPos += 8; continue; }
      for (let k = 7; k >= 0; k--) {
        if ((b >> k) & 1) gridBytes[bitPos >> 3] |= 0x80 >> (bitPos & 7);
        bitPos++;
      }
    }
  };
  writeBits(header);
  writeBits(data);
  return gridBytes;
}

/* ---------- 元数据帧（docs/protocol.md §4）：帧号 0xFFFFFF，12+nameLen 布局 ---------- */
function buildMetadataPayload() {
  const name = new TextEncoder().encode(state.fileName);
  const p = new Uint8Array(12 + name.length);
  const dv = new DataView(p.buffer);
  p[0] = 0x01;                                    // 压缩方式：gzip
  dv.setUint32(1, state.plainSize);               // plainSize（原始文件大小）
  dv.setUint32(5, state.compSize);                // compressedSize（压缩后大小）
  dv.setUint16(9, name.length);                   // nameLen（文件名字节长）
  p[11] = 0x00;                                   // 保留
  p.set(name, 12);
  return p;
}
function buildMetadataFrame() {
  const payload = buildMetadataPayload();
  const h = new Uint8Array(26);
  const dv = new DataView(h.buffer);
  h[0] = 0xF0; h[1] = 0xA5;                       // SYNC（不参与 CRC）
  h[2] = 0x01;                                    // VER
  dv.setUint32(3, state.fileId);                  // FILE_ID
  h[7] = 0xFF; h[8] = 0xFF; h[9] = 0xFF;          // FRAME_NO = 0xFFFFFF（元数据哨兵）
  h[10] = (state.totalFrames >>> 16) & 0xFF;      // TOTAL_FRAMES：数据帧数（不含元数据帧）
  h[11] = (state.totalFrames >>> 8) & 0xFF;
  h[12] = state.totalFrames & 0xFF;
  dv.setUint16(13, payload.length);               // DATA_LEN = 12 + nameLen
  dv.setUint16(15, state.geo.chunkSize);          // CHUNK_SIZE
  h[17] = state.geo.COLS;
  h[18] = state.geo.ROWS;
  h[19] = (state.geo.BIT << 4) | state.geo.PAD;   // GEO：高 4 bit BIT，低 4 bit PAD
  h[20] = 0x80; h[21] = 0x00;                     // FLAGS：bit15 = gzip
  // CRC 覆盖偏移 2–21 + 数据区有效字节（冻结关键）
  dv.setUint32(22, crcFinal(crcUpdate(payload, crcUpdate(h.subarray(2, 22), 0xFFFFFFFF))));
  return { header: h, payload };
}

/* ---------- 渲染：离屏 1px/块 → 整数倍 BIT 放大 + 黑静默区 + 白角标 ---------- */
const stage = el('stage');
const ctx = stage.getContext('2d');
const gridCanvas = document.createElement('canvas');
const gridCtx = gridCanvas.getContext('2d');
let frameImage = null;

function setupCanvas() {
  const { BIT, PAD, COLS, ROWS } = state.geo;
  stage.width = (COLS + 2 * PAD) * BIT;
  stage.height = (ROWS + 2 * PAD) * BIT;
  // CSS 显示尺寸 = 位图 ÷ dpr：1 位图 px = 1 物理 px，全屏播放不拉伸
  //（像素级 1:1 优先，画布不满屏时余下为与静默区同色的黑边）
  const dpr = window.devicePixelRatio || 1;
  stage.style.width = (stage.width / dpr) + 'px';
  stage.style.height = (stage.height / dpr) + 'px';
  gridCanvas.width = COLS; gridCanvas.height = ROWS;
  frameImage = gridCtx.createImageData(COLS, ROWS);
}

function renderGrid(gridBytes) {
  const { BIT, PAD, COLS, ROWS } = state.geo;
  const px = frameImage.data;                       // 先全白（0），再点黑（1）
  for (let i = 0; i < px.length; i++) px[i] = 255;
  for (let byte = 0; byte < gridBytes.length; byte++) {
    const b = gridBytes[byte];
    if (b === 0) continue;
    for (let k = 7; k >= 0; k--) {
      if ((b >> k) & 1) {
        const cell = byte * 8 + (7 - k);
        const o = ((cell / COLS | 0) * COLS + (cell % COLS)) * 4;
        px[o] = px[o + 1] = px[o + 2] = 0; px[o + 3] = 255;
      }
    }
  }
  gridCtx.putImageData(frameImage, 0, 0);
  ctx.imageSmoothingEnabled = false;                // 整数倍缩放，无插值
  ctx.fillStyle = '#000';                           // 静默区
  ctx.fillRect(0, 0, stage.width, stage.height);
  ctx.drawImage(gridCanvas, PAD * BIT, PAD * BIT, COLS * BIT, ROWS * BIT);
  const m = 3 * BIT, ox = PAD * BIT, oy = PAD * BIT, gw = COLS * BIT, gh = ROWS * BIT;
  ctx.fillStyle = '#fff';                           // 角标：白色实心方块，边长 3×BIT，内角贴网格外角
  ctx.fillRect(ox - m, oy - m, m, m);
  ctx.fillRect(ox + gw, oy - m, m, m);
  ctx.fillRect(ox - m, oy + gh, m, m);
  ctx.fillRect(ox + gw, oy + gh, m, m);
}

function renderFrame(frameNo) {
  renderGrid(encodeFrameGrid(buildHeader(frameNo), frameSlice(frameNo)));
}
function renderMetadataFrame() {
  const m = buildMetadataFrame();
  renderGrid(encodeFrameGrid(m.header, m.payload));
}

/* ---------- 播放循环：无限循环重播；元数据帧占一拍，每轮首帧（数据帧 0 前）
   与每 100 数据帧前各插一帧（docs/protocol.md §4） ---------- */
let rafId = 0, lastTs = 0, frameIdx = 0, metaShown = false;
function loop(ts) {
  if (!state.playing) return;
  if (ts - lastTs >= 1000 / state.geo.FPS) {
    lastTs = ts;
    if (!metaShown && frameIdx % 100 === 0) {
      metaShown = true;
      renderMetadataFrame();
    } else {
      metaShown = false;
      renderFrame(frameIdx);
      frameIdx = (frameIdx + 1) % state.totalFrames;
    }
  }
  rafId = requestAnimationFrame(loop);
}

async function startPlayback() {
  state.mode = 'desktop';
  // 先争取全屏再反推几何：全屏成功时窗口 = 屏幕；被拒时按当前窗口反推，
  // 画布必然完整可见、四角角标不被裁掉（几何自举依赖角标）
  try { await document.documentElement.requestFullscreen(); } catch (e) {}  // 非手势场景失败则窗口播放
  try {
    state.geo = deriveGeometry();
  } catch (e) {
    setStatus('几何参数错误：' + e.message, true);
    return;
  }
  state.totalFrames = Math.ceil(state.compSize / state.geo.chunkSize);
  if (state.totalFrames > 0xFFFFFF) { setStatus('文件过大：帧号超出 3 字节上限', true); return; }
  // 元数据帧 12+nameLen 超出 CHUNK_SIZE 时接收端必整帧丢弃（§4），发送端在此拦截，
  // 避免每轮元数据永远缺失、文件无法还原且无提示
  const nameBytes = new TextEncoder().encode(state.fileName).length;
  if (12 + nameBytes > state.geo.chunkSize) {
    setStatus(`文件名过长：12+nameLen=${12 + nameBytes} 超出单帧 CHUNK_SIZE ${state.geo.chunkSize}，无法发送`, true);
    return;
  }
  updateInfo();
  setupCanvas();
  stage.hidden = false;
  document.body.classList.add('playing');
  state.playing = true;
  frameIdx = 0; metaShown = false; lastTs = -1e9;
  rafId = requestAnimationFrame(loop);
}

function stopPlayback() {
  state.playing = false;
  cancelAnimationFrame(rafId);
  stage.hidden = true;
  document.body.classList.remove('playing');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

/* ---------- 文件处理：fileId（纯内容 CRC32）→ gzip → 分片封帧 ---------- */
/* 逐块读流，返回总字节数；onChunk 可选回调处理每块 */
async function readStream(stream, onChunk) {
  const reader = stream.getReader();
  let size = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    size += value.length;
    if (onChunk) onChunk(value);
  }
  return size;
}

async function handleFile(file) {
  stopPlayback();
  setStatus('计算 fileId（纯内容 CRC32）…');
  let crc = 0xFFFFFFFF;
  const plain = await readStream(file.stream(), (v) => { crc = crcUpdate(v, crc); });
  state.fileId = crcFinal(crc);
  state.fileName = file.name; state.plainSize = plain;

  if (typeof CompressionStream === 'undefined') {
    setStatus('本浏览器不支持 CompressionStream，无法 gzip 压缩', true);
    return;
  }
  setStatus('gzip 压缩中…');
  const chunks = [];
  const size = await readStream(file.stream().pipeThrough(new CompressionStream('gzip')), (v) => chunks.push(v));
  state.compBuf = new Uint8Array(size);
  let off = 0;
  for (const c of chunks) { state.compBuf.set(c, off); off += c.length; }
  state.compSize = size;

  setStatus('已就绪，开始全屏循环播放');
  startPlayback();
}

/* ---------- 导出 PNG 序列（F9 最小实现，issue #5）：frames_png/<seq6>.png + frames.json ----------
   闭环自测（CONTEXT.md）：导出目录直喂接收端 images 源，验证双端协议一致性。
   帧序列与播放节奏完全一致：每轮首帧（数据帧 0 / 100 / 200 … 前）先插元数据帧。 */
/* 接收端命令生成（Story 6，issue #18）：复制按钮与 frames.json 同源。
   几何参数由接收端角标自举推导（Story 12），不进命令行，两端参数对齐
   落在源与路径上；desktop 源几何自举，无需传 COLS/ROWS/BIT 等参数。 */
const RECEIVER_COMMANDS = {
  desktop: { label: '全屏播放', cmd: 'python -m receiver receive --source desktop --out output' },
  images:  { label: '导出 PNG', cmd: 'python -m receiver receive --source images --dir frames_png --out output' },
};
function buildReceiverCommand(mode) {
  return RECEIVER_COMMANDS[mode].cmd;
}
function ensureFrameState() {
  if (!state.compBuf) throw new Error('尚未选择文件');
  if (!state.geo) {
    state.geo = deriveGeometry();
    state.totalFrames = Math.ceil(state.compSize / state.geo.chunkSize);
    updateInfo();
  }
}
function exportSequence() {
  const seqs = [];
  for (let f = 0; f < state.totalFrames; f++) {
    if (f % 100 === 0) seqs.push(-1);   // -1 = 元数据帧（docs/protocol.md §4）
    seqs.push(f);
  }
  return seqs;
}
function pngBytes() {
  return new Promise((resolve) => stage.toBlob(resolve, 'image/png'))
    .then((blob) => blob.arrayBuffer())
    .then((buf) => new Uint8Array(buf));
}
function buildFramesJson(totalExported) {
  const g = state.geo;
  return JSON.stringify({
    fileId: '0x' + state.fileId.toString(16).toUpperCase().padStart(8, '0'),
    fileName: state.fileName,
    plainSize: state.plainSize,
    compressedSize: state.compSize,
    geometry: { COLS: g.COLS, ROWS: g.ROWS, BIT: g.BIT, PAD: g.PAD },
    chunkSize: g.chunkSize,
    totalFrames: state.totalFrames,
    totalExported,
    receiverCommand: buildReceiverCommand('images'),
  }, null, 2);
}
async function buildExportFrames() {
  ensureFrameState();
  setupCanvas();   // 画布尺寸就绪（hidden 状态下绘制与导出同样有效）
  const files = [];
  let seq = 0;
  for (const f of exportSequence()) {
    if (f < 0) renderMetadataFrame(); else renderFrame(f);
    seq++;
    files.push({ name: `frames_png/${String(seq).padStart(6, '0')}.png`, bytes: await pngBytes() });
  }
  files.push({ name: 'frames.json', text: buildFramesJson(seq) });
  return files;
}
async function exportViaPicker(files) {
  // 首选目录选择器：用户授权后真实写出 frames_png/ + frames.json
  const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
  const pngDir = await dir.getDirectoryHandle('frames_png', { create: true });
  for (const f of files) {
    const target = f.name === 'frames.json'
      ? await dir.getFileHandle('frames.json', { create: true })
      : await pngDir.getFileHandle(f.name.split('/')[1], { create: true });
    const w = await target.createWritable();
    await w.write(f.bytes ?? f.text);
    await w.close();
  }
}
async function exportViaDownloads(files) {
  // 回退：无目录选择权限 / 不支持时逐文件下载（自动化捕获即取外沿行为）
  for (const f of files) {
    const blob = f.bytes ? new Blob([f.bytes], { type: 'image/png' })
                         : new Blob([f.text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = f.name.includes('/') ? f.name.split('/')[1] : f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    await new Promise((r) => setTimeout(r, 80));   // 逐个错开，便于自动化逐个捕获
  }
}
el('exportBtn').addEventListener('click', async () => {
  const btn = el('exportBtn');
  btn.disabled = true;
  try {
    const files = await buildExportFrames();
    setStatus('导出中…');
    // 自动化环境（navigator.webdriver）：无原生对话框，直接走下载回退，
    // 否则 showDirectoryPicker 在 headless 下会无限挂起
    if (typeof window.showDirectoryPicker === 'function' && !navigator.webdriver) {
      try {
        await exportViaPicker(files);
      } catch (e) {
        if (e && e.name === 'AbortError') { setStatus('已取消导出'); return; }
        await exportViaDownloads(files);   // 授权失败等场景回退为逐文件下载
      }
    } else {
      await exportViaDownloads(files);
    }
    // 复制按钮命令随发送模式切换（issue #18）：导出成功才置 images，
    // 取消 / 失败时 frames_png 未产出，命令不得指向不存在的帧目录
    state.mode = 'images';
    setStatus(`已导出 ${files.length} 个文件（frames_png/*.png + frames.json）`);
  } catch (e) {
    setStatus('导出失败：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

/* 一键复制接收端命令（Story 6，issue #18）：命令与当前发送模式一致。
   剪贴板失败（非安全上下文 / 权限拒绝）给出可见错误并附带命令文本，便于手动复制 */
el('copyCmdBtn').addEventListener('click', async () => {
  const { label, cmd } = RECEIVER_COMMANDS[state.mode];
  try {
    await navigator.clipboard.writeText(cmd);
    setStatus(`已复制接收端命令（${label}）：${cmd}`);
  } catch (e) {
    setStatus(`复制失败（${e && e.message ? e.message : e}）：请手动复制——${cmd}`, true);
  }
});

/* ---------- UI ---------- */
function el(id) { return document.getElementById(id); }
function clampInt(v, lo, hi) {
  const n = parseInt(v, 10);
  return isNaN(n) ? lo : Math.min(hi, Math.max(lo, n));
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function setStatus(msg, isErr) {
  const s = el('status');
  s.textContent = msg;
  s.style.color = isErr ? '#f66' : '#8cf';
  s.style.fontWeight = isErr ? 'bold' : 'normal';
}
function updateInfo() {
  const g = state.geo;
  const rows = [
    ['fileId（内容 CRC32）', '0x' + state.fileId.toString(16).toUpperCase().padStart(8, '0')],
    ['文件名', escapeHtml(state.fileName)],
    ['原始 / 压缩大小', `${state.plainSize} / ${state.compSize} 字节`],
    ['BIT / PAD / FPS', `${g.BIT} px（物理）/ ${g.PAD}×BIT / ${g.FPS}`],
    ['COLS × ROWS', `${g.COLS} × ${g.ROWS}`],
    ['chunkSize', `${g.chunkSize} 字节/帧`],
    ['总帧数', `${state.totalFrames}（每轮约 ${(state.totalFrames / g.FPS).toFixed(1)} 秒）`],
  ];
  const tb = el('info').tBodies[0];
  tb.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  el('info').hidden = false;
}

const drop = el('drop'), fileInput = el('file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', (e) => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
stage.addEventListener('click', stopPlayback);
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') stopPlayback(); });

if (!selfTest()) {
  setStatus('CRC 自检未通过（期望 CRC32("123456789") == 0xCBF43926），已禁用发送', true);
  fileInput.disabled = true;
} else {
  setStatus('自检通过（CRC-32/ISO-HDLC），选择文件开始发送');
}

/* 仅供自动化验证 / 闭环自测使用（file:// 本地，无网络暴露面） */
window.__sender = {
  state, selfTest, crcUpdate, crcFinal, deriveGeometry,
  encodeFrameGrid, buildMetadataPayload, buildMetadataFrame,
  renderFrame, renderMetadataFrame, buildExportFrames, buildReceiverCommand,
};
</script>
